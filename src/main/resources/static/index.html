<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SNMP - Gerência de Redes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans text-gray-800">

<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">Dashboard de Gerenciamento SNMP</h1>

    <div id="mensagem-erro" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6" role="alert">
        <strong class="font-bold">Erro: </strong>
        <span class="block sm:inline" id="texto-erro"></span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Cards de Informação -->
        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
            <h2 class="text-sm text-gray-500 uppercase font-semibold">Nome da Máquina (sysName)</h2>
            <p class="text-xl font-bold mt-2" id="sysName">Carregando...</p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
            <h2 class="text-sm text-gray-500 uppercase font-semibold">Tempo de Atividade (sysUpTime)</h2>
            <p class="text-xl font-bold mt-2" id="sysUpTime">Carregando...</p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500">
            <h2 class="text-sm text-gray-500 uppercase font-semibold">Contato (sysContact)</h2>
            <p class="text-xl font-bold mt-2" id="sysContact">Carregando...</p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-yellow-500">
            <h2 class="text-sm text-gray-500 uppercase font-semibold">Localização (sysLocation)</h2>
            <p class="text-xl font-bold mt-2" id="sysLocation">Carregando...</p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-gray-800 md:col-span-2">
            <h2 class="text-sm text-gray-500 uppercase font-semibold">Descrição do Sistema (sysDescr)</h2>
            <p class="text-lg mt-2" id="sysDescr">Carregando...</p>
        </div>
    </div>
</div>

<script>
    fetch('/api/dados-snmp')
        .then(response => response.json())
        .then(dados => {
            if(dados.erro) {
                document.getElementById('mensagem-erro').classList.remove('hidden');
                document.getElementById('texto-erro').innerText = dados.erro;
            } else {
                document.getElementById('sysName').innerText = dados.sysName;
                document.getElementById('sysUpTime').innerText = dados.sysUpTime;
                document.getElementById('sysContact').innerText = dados.sysContact;
                document.getElementById('sysLocation').innerText = dados.sysLocation;
                document.getElementById('sysDescr').innerText = dados.sysDescr;
            }
        })
        .catch(error => {
            document.getElementById('mensagem-erro').classList.remove('hidden');
            document.getElementById('texto-erro').innerText = "Erro ao conectar com o servidor Java: " + error;
        });
</script>
</body>
</html>
